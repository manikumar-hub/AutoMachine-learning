html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{background:var(--bg);color:var(--txt);font-family:Inter,sans-serif;min-height:100%}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;border:1px solid var(--line);color:var(--txt);cursor:pointer;background:transparent}
.btn:hover{background:var(--panel2)}
.btn-p{background:linear-gradient(135deg,var(--ind),var(--vio));border:0;color:#fff}
.btn-p:hover{background:linear-gradient(135deg,#7275f5,#b366f8);filter:brightness(1.05)}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;color:var(--txt);outline:none}
.inp:focus{border-color:var(--ind);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
.lbl{font-size:12.5px;color:var(--dim);margin-bottom:6px;display:block}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--dim);font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.nav:hover{background:var(--panel2);color:var(--txt)}
.nav.on{background:rgba(99,102,241,.14);color:#c7d2fe}
.tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(52,211,153,.14);color:var(--ok)}
th{font-size:11.5px;font-weight:600;color:var(--faint);text-align:left;padding:0 12px 10px;border-bottom:1px solid var(--line)}
td{padding:12px;font-size:13.5px;color:var(--dim);border-bottom:1px solid rgba(34,42,63,.6)}
tr.sel td{background:rgba(99,102,241,.09);color:var(--txt)}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.auth-bg{background:radial-gradient(600px 300px at 20% 10%,rgba(99,102,241,.18),transparent),radial-gradient(500px 300px at 85% 90%,rgba(168,85,247,.14),transparent),var(--bg)}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

function changeAIProvider(select){

/* ============ AI Insights — attach a data file ============ */
const INSIGHT_MAX_BYTES=20*1024*1024, INSIGHT_CTX_CHARS=14000;
function numStats(vals){const a=vals.filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return null;
 const n=a.length,mean=a.reduce((p,c)=>p+c,0)/n,q=p=>a[Math.min(n-1,Math.floor(p*(n-1)))];
 const sd=Math.sqrt(a.reduce((p,c)=>p+(c-mean)**2,0)/n);
 const r=x=>Math.round(x*1e4)/1e4;return{min:r(a[0]),q1:r(q(.25)),median:r(q(.5)),mean:r(mean),q3:r(q(.75)),max:r(a[n-1]),std:r(sd)}}
function summarizeCSV(name,text){
 const rows=parseCSV(text);if(rows.length<2)throw new Error('CSV me header ke baad koi data row nahi mili.');
 const head=rows[0].map(h=>h.trim()),data=rows.slice(1),n=data.length,columns=head.map((h,i)=>{
  const raw=data.map(r=>(r[i]??'').trim()),ne=raw.filter(x=>x!==''),missing=n-ne.length;
  const numeric=ne.length>0&&ne.every(x=>!isNaN(+x));
  const info={name:h,type:numeric?'numeric':'categorical',missing,missing_pct:+(missing/n*100).toFixed(1),unique:new Set(ne).size};
  if(numeric)info.stats=numStats(ne.map(Number));
  else{const c={};ne.forEach(x=>c[x]=(c[x]||0)+1);info.top_values=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([v,k])=>`${v.slice(0,40)} (${k})`)}
  return info});
 const numCols=columns.filter(c=>c.type==='numeric'&&c.stats).map(c=>c.name),corr=[];
 if(numCols.length>1&&numCols.length<=25){const idx=numCols.map(c=>head.indexOf(c)),vec=idx.map(i=>data.map(r=>+r[i]));
  for(let a=0;a<idx.length;a++)for(let b=a+1;b<idx.length;b++){let sx=0,sy=0,sxx=0,syy=0,sxy=0,m=0;
   for(let k=0;k<n;k++){const x=vec[a][k],y=vec[b][k];if(Number.isFinite(x)&&Number.isFinite(y)){m++;sx+=x;sy+=y;sxx+=x*x;syy+=y*y;sxy+=x*y}}
   const d=Math.sqrt((m*sxx-sx*sx)*(m*syy-sy*sy));if(m>2&&d>0)corr.push([numCols[a],numCols[b],+((m*sxy-sx*sy)/d).toFixed(3)])}
  corr.sort((p,q)=>Math.abs(q[2])-Math.abs(p[2]))}
 const dups=n-new Set(data.map(r=>r.join('\u0001'))).size;
 const summary={file:name,rows:n,columns:head.length,duplicate_rows:dups,column_details:columns,top_correlations:corr.slice(0,8),sample_rows:data.slice(0,8).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').slice(0,40)])))};
 let text_=JSON.stringify(summary);
 if(text_.length>INSIGHT_CTX_CHARS){summary.sample_rows=summary.sample_rows.slice(0,3);summary.column_details=columns.slice(0,60);text_=JSON.stringify(summary)}
 return{name,kind:'csv',rows:n,cols:head.length,text:text_.slice(0,INSIGHT_CTX_CHARS)}}
async function attachInsightFile(file){
 S.insightFileErr='';if(!file)return;
 try{
  if(file.size>INSIGHT_MAX_BYTES)throw new Error('File 20 MB se chhoti honi chahiye.');
  const text=await file.text(),ext=(file.name.split('.').pop()||'').toLowerCase();

  else S.insightFile={name:file.name,kind:ext,rows:null,cols:null,text:text.slice(0,INSIGHT_CTX_CHARS),truncated:text.length>INSIGHT_CTX_CHARS};
 }catch(error){S.insightFile=null;S.insightFileErr=error.message||String(error)}
 render()}

async function beCall(path,opt={}){const token=await Auth.idToken();
 const headers={...(opt.headers||{}),...(token?{Authorization:`Bearer ${token}`}:{})};
 const ctrl=new AbortController();
 const timeout=setTimeout(()=>ctrl.abort(),180000);
 try{
  const r=await fetch(API.base+path,{...opt,headers,signal:ctrl.signal});
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||`${path} failed`);
  return r.json()
 }catch(e){
  if(e.name==='AbortError')throw new Error(`${path} timed out after 3 minutes — the backend may be stuck on a slow step.`);
  throw e
 }finally{clearTimeout(timeout)}}

function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}
 else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.length>1||r[0]!=='')rows.push(r);r=[]}else c+=ch}
 if(c!==''||r.length){r.push(c);rows.push(r)}return rows}
function buildProfile(name,rows){const h=rows[0],d=rows.slice(1);let miss=0;
 const columns=h.map((n,i)=>{const v=d.map(r=>(r[i]??'').trim()),ne=v.filter(x=>x!=='');const m=v.length-ne.length;miss+=m;
  return{n,t:ne.length&&ne.every(x=>!isNaN(+x))?'numeric':'categorical',m,u:new Set(ne).size}});
 return{name,rows:d.length,cols:h.length,missing:miss,dups:d.length-new Set(d.map(r=>r.join('\u0001'))).size,columns}}

function dashboard(){const P=S.projects,has=P.length>0;

 ${P.slice(0,5).map(p=>`<tr><td><button class="!text-white font-medium hover:text-indigo-300" onclick="openProject('${esc(p.id)}')">${esc(p.name||'Untitled project')}</button></td><td class="mono text-xs">${esc(p.dataset||'—')}</td><td>${esc(p.problem||'—')}</td><td>${esc(p.bestModel||p.model||'—')}</td><td class="mono">${p.score==null?'—':f(p.score)}</td><td><span class="tag" style="${p.status==='Failed'?'background:rgba(248,113,113,.14);color:#fca5a5':''}">${esc(p.status||'Unknown')}</span></td></tr>`).join('')}</tbody></table></div><button class="btn mt-3" onclick="go('projects')">View all projects ${ic('arrow',14)}</button>`
 :`<div class="card p-10 text-center"><div class="w-11 h-11 mx-auto rounded-xl flex items-center justify-center mb-3" style="background:rgba(99,102,241,.15);color:#a5b4fc">${ic('folder',20)}</div>
 <p class="font-semibold">No projects yet</p><p class="text-sm mt-1" style="color:var(--dim)">Once you train a model it will show up here.</p></div>`}`}

 ${project.error?`<div class="p-3 rounded-xl mb-4 text-sm" style="background:rgba(248,113,113,.12);color:#fca5a5">${esc(project.error)}</div>`:''}
 <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5">${[['Status',project.status||'Unknown'],['Target',project.target||'—'],['Problem',project.problem||'—'],['Best model',project.bestModel||project.model||'—']].map(([label,value])=>`<div class="card p-5"><div class="text-sm" style="color:var(--dim)">${label}</div><div class="font-semibold mt-2">${esc(value)}</div></div>`).join('')}</div>
 <div class="card p-5 mb-5"><div class="flex flex-wrap gap-x-8 gap-y-2 text-sm" style="color:var(--dim)"><span>Dataset: <strong class="text-white">${esc(project.dataset||'—')}</strong></span><span>Rows: <strong class="text-white">${fmt(project.rows)}</strong></span><span>Columns: <strong class="text-white">${fmt(project.columns)}</strong></span><span>Score: <strong class="text-white">${project.score==null?'—':f(project.score)}</strong></span></div></div>
 ${project.features?.length?`<div class="card p-5 mb-5"><div class="text-sm font-semibold mb-2">Selected features</div><div class="flex flex-wrap gap-2">${project.features.map(feature=>`<span class="tag mono">${esc(feature)}</span>`).join('')}</div></div>`:''}
 <h2 class="text-base font-semibold mb-3">Trained models</h2><div class="card overflow-x-auto"><table class="w-full min-w-[600px]"><thead><tr class="[&_th]:pt-4"><th>Model</th>${labels.map(label=>`<th>${label}</th>`).join('')}</tr></thead><tbody>
 ${models.length?models.map(model=>model.error?`<tr><td class="!text-white font-medium">${esc(model.name)}</td><td colspan="${metrics.length}"><span class="tag warn">Failed</span> ${esc(model.error)}</td></tr>`:`<tr class="${model.name===project.bestModel?'sel':''}"><td class="!text-white font-medium">${esc(model.name)}${model.name===project.bestModel?' · Best':''}</td>${metrics.map(key=>`<td class="mono">${model[key]==null?'—':f(model[key])}</td>`).join('')}</tr>`).join(''):`<tr><td class="text-center" colspan="${metrics.length+1}">No model results were saved for this run.</td></tr>`}
 </tbody></table></div>
 ${result.cm?`<h2 class="text-base font-semibold mt-6 mb-3">Confusion matrix</h2><div class="card p-5 max-w-xl">${cm(result.cm)}</div>`:''}`;

async function openProject(id){
 S.project=S.projects.find(project=>project.id===id)||null;
 if(!S.project&&S.user?.uid){S.projectBusy=true;render();try{const snapshot=await CloudStorage.db.ref(`users/${S.user.uid}/projects/${id}`).once('value');const value=snapshot.val();S.project=value?{id,...value}:null}catch(error){S.dataErr=error.message}finally{S.projectBusy=false}}
 if(!S.project){S.dataErr=S.dataErr||'Project record not found.';return render()}
 S.route='project-detail';render();
}
async function renameProject(id){
 const project=S.projects.find(item=>item.id===id);if(!project)return;
 const name=prompt('Project name',project.name||'');if(name===null)return;
 if(!name.trim())return alert('Project name cannot be empty.');
 try{await Db.updateProject(S.user.uid,id,{name:name.trim()});project.name=name.trim();if(S.project?.id===id)S.project.name=name.trim();render()}
 catch(error){alert(`Could not rename project: ${error.message}`)}
}
async function deleteProject(id){
 const project=S.projects.find(item=>item.id===id);if(!project||!confirm(`Delete project "${project.name||'Untitled project'}"? This cannot be undone.`))return;
 try{
  if(project.modelPath)await CloudStorage.deletePath(project.modelPath);
  await Db.deleteProject(S.user.uid,id);
  S.projects=S.projects.filter(item=>item.id!==id);S.project=null;
  if(S.route==='project-detail')S.route='projects';render();if(S.datasets.length)loadDatasets();
 }catch(error){alert(`Could not delete project: ${error.message}`)}
}
async function downloadStoredModel(id){
 const project=S.projects.find(item=>item.id===id)||S.project;if(!project?.modelPath)return alert('This project has no saved model artifact.');
 try{const blob=await CloudStorage.download(project.modelPath),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`${(project.bestModel||'model').replace(/[^a-z0-9_-]/gi,'_')}.joblib`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
 catch(error){alert(`Could not download model: ${error.message}`)}
}
async function loadDatasets(){
 if(!CloudStorage.ready||!S.user?.uid){S.datasets=[];return}
 S.datasetsBusy=true;S.dataErr='';render();
 try{
  const [stored,records]=await Promise.all([CloudStorage.listDatasets(S.user.uid),Db.listDatasetRecords(S.user.uid)]);
  const byPath=new Map(Object.values(records).map(record=>[record.path,record]));
  S.datasets=stored.map(item=>({...byPath.get(item.path),...item,recordId:byPath.get(item.path)?.id||null,
   usedIn:S.projects.filter(project=>project.datasetPath===item.path).length}));
 }catch(error){S.dataErr=`Could not load datasets: ${error.message}`}
 finally{S.datasetsBusy=false;render()}
}
function datasetsPage(){
 return `<div class="flex flex-wrap justify-between items-end gap-3 mb-6"><div><h1 class="text-2xl font-bold">Datasets</h1><p class="text-sm mt-1" style="color:var(--dim)">CSV files in your Firebase Storage account and the projects that use each one.</p></div><button class="btn" onclick="loadDatasets()" ${S.datasetsBusy?'disabled':''}>${S.datasetsBusy?'Refreshing…':'Refresh list'}</button></div>
 ${S.dataErr?`<div class="p-3 rounded-xl mb-4 text-sm" style="background:rgba(248,113,113,.12);color:#f87171">${esc(S.dataErr)}</div>`:''}
 ${!CloudStorage.ready?`<div class="card p-8 text-center">Firebase is not configured. Connect Firebase Authentication, Realtime Database, and Storage to manage datasets.</div>`:
 `<div class="grid gap-3">${S.datasetsBusy&&!S.datasets.length?'<div class="card p-8 text-center">Loading dataset files…</div>':S.datasets.length?S.datasets.map((dataset,index)=>`<article class="card p-5 flex flex-wrap items-center justify-between gap-4"><div class="min-w-0"><div class="font-semibold mono break-all">${esc(dataset.filename||dataset.name||'CSV dataset')}</div><div class="text-sm mt-2" style="color:var(--dim)">${dataset.rows==null?'Rows unavailable':`${fmt(dataset.rows)} rows`} · ${dataset.columns==null?'Columns unavailable':`${fmt(dataset.columns)} columns`} · ${fmt(dataset.size)} bytes</div><div class="text-xs mt-1" style="color:var(--faint)">Uploaded ${dataset.uploadedAt?new Date(dataset.uploadedAt).toLocaleString():'date unavailable'} · Used in ${dataset.usedIn} ${dataset.usedIn===1?'project':'projects'}</div></div><div class="flex gap-2"><button class="btn btn-p" onclick="startDataset(${index})">Start new project</button><button class="btn danger" onclick="deleteDataset(${index})">Delete</button></div></article>`).join(''):'<div class="card p-8 text-center" style="color:var(--dim)">No CSV uploads found in this account yet.</div>'}</div>`}`;
}
async function startDataset(index){
 const dataset=S.datasets[index];if(!dataset)return;
 try{
  const blob=await CloudStorage.download(dataset.path),file=new File([blob],dataset.filename||'dataset.csv',{type:'text/csv'});
  const csv=await file.text();S.file=file;S.dataset=dataset;S.cloud={state:'done',...dataset};S.profile=buildProfile(file.name,parseCSV(csv));
  afterLoad();S.route='target';render();
 }catch(error){alert(`Could not load this dataset: ${error.message}`)}
}
async function deleteDataset(index){
 const dataset=S.datasets[index];if(!dataset)return;
 const message=dataset.usedIn?`This dataset is used by ${dataset.usedIn} project(s). Delete the CSV file? Saved model artifacts and project records will remain.`:`Delete ${dataset.filename||'this dataset'}?`;
 if(!confirm(message))return;
 try{
  await CloudStorage.deletePath(dataset.path);
  if(dataset.recordId)await Db.deleteDatasetRecord(S.user.uid,dataset.recordId);
  S.datasets.splice(index,1);S.dataErr='';render();
 }catch(error){S.dataErr=`Could not delete dataset: ${error.message}`;render()}
}

function upload(){const p=S.profile;
 return stepper('upload')+`<h1 class="text-2xl font-bold mb-5">Upload dataset</h1>`+(p?`<div class="card p-6 flex flex-wrap items-center justify-between gap-4"><div class="flex items-center gap-4"><div class="w-11 h-11 rounded-xl flex items-center justify-center" style="background:rgba(52,211,153,.14);color:var(--ok)">${ic('check',22)}</div>
 <div><div class="font-semibold mono text-sm">${p.name}</div><div class="text-sm" style="color:var(--dim)">${p.rows.toLocaleString()} rows · ${p.cols} columns</div>${cloudLine()}</div></div>
 <div class="flex gap-2"><button class="btn" onclick="S.profile=null;render()">Replace</button><button class="btn btn-p" onclick="go('profile')">Analyze dataset ${ic('arrow',16)}</button></div></div>`:dropzone(true))}

function profile(){const p=S.profile;if(!p)return upload();
 const cards=[['Rows',p.rows.toLocaleString()],['Columns',p.cols],['Missing values',p.missing],['Duplicate rows',p.dups]];
 return stepper('profile')+`<h1 class="text-2xl font-bold">${p.name.replace(/\.csv$/i,'').replace(/[_-]/g,' ')}</h1><p class="text-sm mt-1 mb-6" style="color:var(--dim)">Here is what AutoML AI found in your data.</p>
 <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">${cards.map(c=>`<div class="card p-5"><div class="text-sm" style="color:var(--dim)">${c[0]}</div><div class="text-2xl font-bold disp mt-1">${c[1]}</div></div>`).join('')}</div>
 <h2 class="text-base font-semibold mb-3">Column overview</h2><div class="card overflow-x-auto"><table class="w-full min-w-[560px]"><thead><tr class="[&_th]:pt-4"><th>Column</th><th>Type</th><th>Missing</th><th>Unique</th></tr></thead><tbody>
 ${p.columns.map(c=>`<tr><td class="mono !text-white text-[13px]">${c.n}</td><td><span class="tag" style="background:${c.t==='numeric'?'rgba(99,102,241,.15)':'rgba(168,85,247,.15)'};color:${c.t==='numeric'?'#a5b4fc':'#d8b4fe'}">${c.t}</span></td>
 <td><div class="flex items-center gap-2"><div class="w-16 h-1.5 rounded-full" style="background:var(--panel2)"><div class="h-full rounded-full" style="width:${Math.min(100,c.m/p.rows*4000)}%;background:${c.m?'#fbbf24':'var(--ok)'}"></div></div>${c.m}</div></td><td class="mono">${c.u.toLocaleString()}</td></tr>`).join('')}</tbody></table></div>

function target(){const p=S.profile;if(!p)return upload();const col=p.columns.find(c=>c.n===S.target),pt=detectProblem(col);
 const why=pt==='classification'?(col.t==='categorical'?'your target contains categorical values':`your target has only ${col.u} distinct numeric values (15 or fewer)`):`your target is numeric with ${col.u.toLocaleString()} distinct values`;
 return stepper('target')+`<div class="card p-7 max-w-xl mx-auto"><h1 class="text-xl font-bold mb-5">What do you want to predict?</h1>

 <div class="mt-4 p-3 rounded-xl text-sm flex gap-2" style="background:rgba(99,102,241,.1);color:#c7d2fe"><span class="shrink-0 mt-0.5">${ic('spark',15)}</span>AI detected this as a ${pt} problem because ${why}.</div>
 <div class="flex justify-between mt-6"><button class="btn" onclick="go('profile')">Back</button><button class="btn btn-p" onclick="goToFeatures()">Continue ${ic('arrow',16)}</button></div>
 <div class="text-xs text-center mt-5" style="color:var(--faint)">No target column? <a href="#" style="color:#a5b4fc" onclick="event.preventDefault();go('experiments')">Find natural groups with clustering →</a></div></div>`}

async function goToFeatures(){
 if(!S.file){S.backendReady=false;return train()} // sample dataset has no real file -> straight to demo training
 S.route='features';S.cols=null;S.colsErr='';render();
 try{
  await API.uploadReal(S.file);const targetResult=await API.setTarget(S.target);S.problem=targetResult.problem_type;await API.cleanColumns();
  const r=await API.columnsReal();S.backendReady=true;S.cols=r.columns;
  S.selected=new Set(r.columns.filter(c=>!c.is_target&&!c.suggestion).map(c=>c.name));
  render();
 }catch(e){S.backendReady=false;S.colsErr=`Could not load feature columns: ${e.message||e}`;render()}}

function toggleFeature(name){S.selected.has(name)?S.selected.delete(name):S.selected.add(name);render()}
function selectAllFeatures(){S.cols.forEach(c=>{if(!c.is_target)S.selected.add(c.name)});render()}
function applySuggestions(){S.cols.forEach(c=>{if(c.suggestion)S.selected.delete(c.name)});render()}

function featuresPage(){
 if(!S.cols)return stepper('features')+`<div class="card p-10 text-center">${S.colsErr?`<div class="text-sm mb-4" style="color:#f87171">${esc(S.colsErr)}</div><div class="flex justify-center gap-2"><button class="btn" onclick="go('target')">Back</button><button class="btn btn-p" onclick="goToFeatures()">Retry</button></div>`:`<div class="mx-auto mb-3" style="color:#a5b4fc">${ic('load',22,'spin')}</div><p class="text-sm" style="color:var(--dim)">Reading column info from the backend…</p>`}</div>`;

 return stepper('features')+`<div class="card p-6"><div class="flex flex-wrap justify-between items-center gap-3 mb-1"><h1 class="text-xl font-bold">Choose feature columns</h1>

 <div class="max-h-[420px] overflow-y-auto rounded-xl" style="border:1px solid var(--line)"><table class="w-full"><thead><tr class="[&_th]:pt-3" style="position:sticky;top:0;background:var(--panel)"><th></th><th>Column</th><th>Type</th><th>Missing</th><th>Unique</th></tr></thead><tbody>
 ${S.cols.map((c,index)=>c.is_target?`<tr class="opacity-50"><td class="pl-3"><input type="checkbox" checked disabled class="accent-indigo-500"></td><td class="mono !text-white">${esc(c.name)}</td><td>${esc(c.dtype)}</td><td>—</td><td>—</td></tr>`:
 `<tr><td class="pl-3"><input type="checkbox" data-index="${index}" ${S.selected.has(c.name)?'checked':''} onchange="toggleFeature(S.cols[Number(this.dataset.index)].name)" class="accent-indigo-500"></td>
 <td class="mono !text-white">${esc(c.name)}${c.suggestion?` <span class="tag ml-1" style="background:${SUG[c.suggestion][1]}22;color:${SUG[c.suggestion][1]}">${SUG[c.suggestion][0]}</span>`:''}</td>
 <td>${esc(c.dtype)}</td><td>${c.missing_pct}%</td><td class="mono">${c.unique.toLocaleString()}</td></tr>`).join('')}</tbody></table></div>

 ${k[2]?`<div class="pt-3"><label class="lbl">Column ${k[2]===1?'(optional)':''}</label><select class="inp mono" onchange="S.an.col=this.value"><option value="">${k[2]===1?'All numeric':'Auto'}</option>${cols.map(c=>`<option ${c.n===a.col?'selected':''}>${c.n}</option>`).join('')}</select></div>`:''}
 <button class="btn btn-p w-full mt-3" onclick="runAnalysis()" ${a.busy?'disabled':''}>${a.busy?ic('load',16,'spin')+' Rendering…':'Generate chart'}</button></div>
 <div class="card p-4 min-h-[320px] flex items-center justify-center">${a.err?`<p class="text-sm text-center max-w-sm" style="color:#f87171">${a.err}</p>`:a.img?`<img src="${a.img}" alt="${k[1]}" class="max-w-full rounded-lg">`:`<p class="text-sm" style="color:var(--faint)">Pick a chart and press Generate.</p>`}</div></div>`}
async function runAnalysis(){const a=S.an;a.err='';a.img=null;
 if(!S.file){a.err='Charts need the original CSV. Upload a file (the sample dataset has none).';return render()}
 a.busy=true;render();
 try{
  if(!S.backendReady){await API.uploadReal(S.file);S.backendReady=true}
  a.img=(await API.analyze(a.kind,a.col)).image
 }catch(e){a.err=e.message.includes('fetch')?'Backend not reachable. Start it with: uvicorn main:app --port 8000':e.message}
 a.busy=false;render()}

/* ============ Predict page: load a model (session or uploaded .joblib), fill inputs, get a result ============ */
function initPredict(){if(!S.pred)S.pred={schema:null,values:{},result:null,busy:false,err:''};return S.pred}

async function loadSessionModel(){const p=initPredict();p.err='';p.busy=true;render();
 try{p.schema=await API.modelSchema();p.values={};p.schema.fields.forEach(f=>p.values[f.name]=f.example)}
 catch(e){p.err=e.message}p.busy=false;render()}

async function uploadModelFile(file){if(!file)return;const p=initPredict();p.err='';p.busy=true;render();
 try{p.schema=await API.uploadModel(file);p.values={};p.schema.fields.forEach(f=>p.values[f.name]=f.example)}
 catch(e){p.err=e.message}p.busy=false;render()}

async function runPredict(){const p=S.pred;p.err='';p.result=null;p.busy=true;render();
 try{p.result=await API.predict(p.values)}catch(e){p.err=e.message}p.busy=false;render()}

function predictPage(){const p=initPredict();
 if(!p.schema)return `<h1 class="text-2xl font-bold mb-2">Predict</h1><p class="text-sm mb-6" style="color:var(--dim)">Load a model to get feature inputs ready for prediction.</p>
 <div class="grid sm:grid-cols-2 gap-5 max-w-2xl">
 <button class="card p-6 text-left hover:bg-[var(--panel2)]" onclick="loadSessionModel()"><div class="font-semibold flex items-center gap-2">${ic('spark',17)} Use the model I just trained</div><p class="text-sm mt-1" style="color:var(--dim)">Uses the best model from your current session.</p></button>
 <label class="card p-6 text-left cursor-pointer hover:bg-[var(--panel2)] block"><div class="font-semibold flex items-center gap-2">${ic('up',17)} Upload a downloaded model</div><p class="text-sm mt-1" style="color:var(--dim)">A .joblib file from "Download model" on the results page.</p>
 <input type="file" accept=".joblib" hidden onchange="uploadModelFile(this.files[0])"></label></div>
 ${p.busy?`<div class="mt-5 flex items-center gap-2 text-sm" style="color:var(--dim)">${ic('load',16,'spin')} Loading model…</div>`:''}
 ${p.err?`<div class="mt-5 text-sm p-3 rounded-xl max-w-2xl" style="background:rgba(248,113,113,.12);color:#f87171">${p.err}</div>`:''}`;

 return `<div class="flex justify-between items-start mb-5"><div><h1 class="text-2xl font-bold">Predict</h1><p class="text-sm mt-1" style="color:var(--dim)">${p.schema.model} · predicting <span class="mono">${p.schema.target}</span></p></div>
 <button class="btn !text-xs" onclick="S.pred=null;render()">Load a different model</button></div>
 <div class="grid lg:grid-cols-[1fr_320px] gap-5">
 <div class="card p-6"><div class="grid sm:grid-cols-2 gap-4">
 ${p.schema.fields.map(f=>`<div><label class="lbl">${f.name} <span class="text-[10px]" style="color:var(--faint)">(${f.type})</span></label>
 <input class="inp mono" type="${f.type==='numeric'?'number':'text'}" step="any" placeholder="e.g. ${f.example}" value="${p.values[f.name]??''}" oninput="S.pred.values['${f.name}']=this.value"></div>`).join('')}
 </div><button class="btn btn-p w-full mt-6" onclick="runPredict()" ${p.busy?'disabled':''}>${p.busy?ic('load',16,'spin'):'Predict'}</button></div>
 <div class="card p-6">${p.err?`<p class="text-sm" style="color:#f87171">${p.err}</p>`:p.result?`
 <div class="text-xs" style="color:var(--faint)">Prediction</div><div class="text-2xl font-bold disp mt-1 mono">${p.result.prediction}</div>
 ${p.result.probabilities?`<div class="mt-4 space-y-2">${Object.entries(p.result.probabilities).map(([k,v])=>`<div><div class="flex justify-between text-xs mb-1"><span class="mono">${k}</span><span class="mono">${f(v)}</span></div><div class="h-1.5 rounded-full" style="background:var(--panel2)"><div class="h-full rounded-full" style="width:${v*100}%;background:linear-gradient(90deg,var(--ind),var(--vio))"></div></div></div>`).join('')}</div>`:''}`
 :`<p class="text-sm" style="color:var(--faint)">Fill in the values and press Predict.</p>`}</div></div>`}

/* ============ Experiments: clustering lab ============ */
const CL_ALGOS=[['KMeans','K-Means','Fast, round-shaped groups'],['GaussianMixture','Gaussian Mixture','Oval-shaped groups'],['Agglomerative','Hierarchical','Merges the closest points step by step'],['Birch','BIRCH','Good for bigger data'],['DBSCAN','DBSCAN','Dense areas and outliers']];
const CL_COLORS=['#6366f1','#34d399','#fbbf24','#f87171','#38bdf8','#c084fc','#fb923c','#a3e635','#f472b6','#2dd4bf','#94a3b8','#e879f9'];
const clColor=i=>i<0?'#64748b':CL_COLORS[i%CL_COLORS.length];
API.cluster=body=>beCall('/cluster',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
API.clusterPredict=values=>beCall('/cluster/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({values})});

function initCl(){const p=S.profile;
 if(!S.cl)S.cl={sel:new Set(),kmin:2,kmax:8,algos:new Set(CL_ALGOS.map(a=>a[0])),busy:false,err:'',res:null,forName:'',predVals:{},predOut:null,predBusy:false,predErr:'',history:[]};
 const c=S.cl;
 if(p&&c.forName!==p.name){c.forName=p.name;c.res=null;c.err='';c.predVals={};c.predOut=null;c.predErr='';
  const n=Math.max(p.rows,1);
  c.sel=new Set(p.columns.filter(x=>x.u>1&&x.m/n<=0.6&&(x.t==='numeric'||(x.u<=30&&x.u/n<=0.95))).map(x=>x.n))}
 return c}
function clToggleCol(i){const c=initCl(),n=S.profile.columns[i].n;c.sel.has(n)?c.sel.delete(n):c.sel.add(n);render()}
function clToggleAlgo(a){const c=initCl();c.algos.has(a)?c.algos.delete(a):c.algos.add(a);render()}
function clSetK(which,v){const c=initCl();c[which]=Math.max(2,Math.min(12,parseInt(v)||2));if(c.kmax<c.kmin)c[which==='kmin'?'kmax':'kmin']=c[which];render()}
function clSetVal(i,v){const c=initCl();c.predVals[c.res.schema[i].name]=v}

async function runClustering(){const c=initCl();
 if(!S.file){c.err='Clustering needs your real CSV upload. Please upload the file again (the sample dataset cannot be clustered).';return render()}
 if(!c.sel.size||!c.algos.size){c.err=!c.sel.size?'Select at least one column.':'Select at least one algorithm.';return render()}
 c.busy=true;c.err='';render();
 const body={features:[...c.sel],algorithms:[...c.algos],k_min:c.kmin,k_max:c.kmax};
 try{
  if(S.beFile!==S.file)await API.uploadReal(S.file);
  let res;
  try{res=await API.cluster(body)}
  catch(e){if(!/upload a CSV|Columns not found/i.test(e.message||''))throw e;await API.uploadReal(S.file);res=await API.cluster(body)}
  c.res=res;c.predVals={};c.predOut=null;c.predErr='';
  c.history.unshift({at:Date.now(),algo:res.best.algorithm,param:res.best.param,k:res.best.n_clusters,sil:res.best.silhouette,cols:res.features_used.length,rows:res.rows_used});
  c.history=c.history.slice(0,8)
 }catch(e){c.err=e.message||String(e)}
 c.busy=false;render()}

async function clAssign(){const c=initCl();c.predBusy=true;c.predErr='';c.predOut=null;render();
 try{c.predOut=await API.clusterPredict(c.predVals)}catch(e){c.predErr=e.message||String(e)}
 c.predBusy=false;render()}

async function downloadClusters(){
 try{
  const token=await Auth.idToken();
  const r=await fetch(API.base+'/cluster/download',{headers:token?{Authorization:`Bearer ${token}`}:{}});
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||'Download failed');
  const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clustered_data.csv';a.click();URL.revokeObjectURL(a.href);
 }catch(e){alert(e.message)}}
function explainClusters(){go('insights');ask('Explain my clustering results in simple words: what does each cluster represent, which algorithm looks best and why, and what could I do with these groups?')}

function clLineChart(series,yKey){
 const W=520,H=240,L=48,R=14,T=12,B=34,pts=series.flatMap(s=>s.pts.filter(p=>p[yKey]!=null));
 if(!pts.length)return `<div class="text-sm py-8 text-center" style="color:var(--dim)">Not enough data for this chart.</div>`;
 const xs=pts.map(p=>p.k),ys=pts.map(p=>p[yKey]),span=(Math.max(...ys)-Math.min(...ys))||1,y0=Math.min(...ys)-span*.1,y1=Math.max(...ys)+span*.1,x0=Math.min(...xs),x1=Math.max(...xs);
 const X=v=>L+(x1===x0?.5:(v-x0)/(x1-x0))*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
 const grid=[0,1,2,3,4].map(i=>{const v=y0+(y1-y0)*i/4,y=Y(v);return `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+3}" text-anchor="end" font-size="10" fill="var(--dim)">${Math.abs(v)>=1000?Math.round(v):+v.toFixed(2)}</text>`}).join('');
 const ticks=[...new Set(xs)].sort((a,b)=>a-b).map(k=>`<text x="${X(k)}" y="${H-18}" text-anchor="middle" font-size="10" fill="var(--dim)">${k}</text>`).join('');
 const lines=series.map(s=>{const sp=s.pts.filter(p=>p[yKey]!=null);return `<polyline fill="none" stroke="${s.color}" stroke-width="2" points="${sp.map(p=>`${X(p.k)},${Y(p[yKey])}`).join(' ')}"/>`+sp.map(p=>`<circle cx="${X(p.k)}" cy="${Y(p[yKey])}" r="3" fill="${s.color}"><title>${esc(s.name)} · k=${p.k}: ${p[yKey]}</title></circle>`).join('')}).join('');
 return `<svg viewBox="0 0 ${W} ${H}" class="w-full">${grid}${ticks}<text x="${(L+W-R)/2}" y="${H-3}" text-anchor="middle" font-size="10" fill="var(--dim)">number of clusters (k)</text>${lines}</svg>`}

function clScatter(pca){
 const W=520,H=340,L=14,R=12,T=12,B=30,P=pca.points;
 if(!P.length)return '';
 const xs=P.map(p=>p.x),ys=P.map(p=>p.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 const X=v=>L+(x1===x0?.5:(v-x0)/(x1-x0))*(W-L-R),Y=v=>T+(1-(y1===y0?.5:(v-y0)/(y1-y0)))*(H-T-B);
 const dots=P.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="${clColor(p.c)}" fill-opacity=".7"/>`).join('');
 const e=pca.explained;
 return `<svg viewBox="0 0 ${W} ${H}" class="w-full"><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="none" stroke="var(--line)"/>${dots}<text x="${(L+W-R)/2}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--dim)">PC1 (${(e[0]*100).toFixed(0)}% of variation) →</text><text x="${(L+W-R)/2}" y="${H-0}" text-anchor="middle" font-size="9" fill="var(--faint)">PC2 (${(e[1]*100).toFixed(0)}%) is vertical</text></svg>`}

const clChip=(on,label,click,tip)=>`<button type="button" class="px-3 py-1.5 rounded-lg text-xs mono" style="border:1px solid ${on?'#6366f1':'var(--line)'};background:${on?'rgba(99,102,241,.16)':'var(--panel2)'};color:${on?'#c7d2fe':'var(--dim)'}" onclick="${click}" ${tip?`title="${esc(tip)}"`:''}>${esc(label)}</button>`;

function clResults(R,c){
 const b=R.best,name=a=>(CL_ALGOS.find(x=>x[0]===a)||[a,a])[1];
 const notes=[
  R.sampled?`Large dataset: clusters were found on a random sample of ${fmt(R.rows_used)} of ${fmt(R.rows_total)} rows. Every row still gets a cluster in the download.`:'',
  R.truncated?'Time limit reached, so some settings were not tried. Narrow the cluster range or pick fewer algorithms to try them all.':'',
  Object.keys(R.skipped_columns||{}).length?`Skipped columns: ${Object.entries(R.skipped_columns).map(([k,v])=>`${esc(k)} (${esc(v)})`).join(', ')}.`:''
 ].filter(Boolean);
 const algoRows=R.algorithms.map(a=>a.error?`<tr><td class="!text-white">${esc(name(a.algorithm))}</td><td colspan="6" style="color:var(--faint)">${esc(a.error)}</td></tr>`:
  `<tr style="${a.algorithm===b.algorithm?'background:rgba(99,102,241,.1)':''}"><td class="!text-white">${esc(name(a.algorithm))} ${a.algorithm===b.algorithm?'<span class="tag green ml-1">Best</span>':''}</td><td class="mono">${esc(a.param)}</td><td class="mono">${a.n_clusters}</td><td class="mono">${a.silhouette}</td><td class="mono">${a.davies_bouldin}</td><td class="mono">${fmt(a.calinski_harabasz)}</td><td class="mono">${a.noise_pct}%</td></tr>`).join('');
 const curveSeries=Object.entries(R.curves).filter(([,v])=>v.length).map(([a,v])=>({name:name(a),color:CL_COLORS[CL_ALGOS.findIndex(x=>x[0]===a)%CL_COLORS.length],pts:v}));
 const elbow=R.curves.KMeans&&R.curves.KMeans.length?[{name:'K-Means inertia',color:CL_COLORS[0],pts:R.curves.KMeans}]:null;
 const legend=curveSeries.map(s=>`<span class="inline-flex items-center gap-1 text-xs mr-3" style="color:var(--dim)"><i style="width:10px;height:10px;border-radius:3px;background:${s.color};display:inline-block"></i>${esc(s.name)}</span>`).join('');
 const cards=R.profiles.map(p=>`<div class="card p-5"><div class="flex items-center justify-between mb-2"><div class="font-semibold flex items-center gap-2"><i style="width:11px;height:11px;border-radius:99px;background:${clColor(p.cluster)};display:inline-block"></i>${esc(p.name)}</div><span class="text-xs mono" style="color:var(--dim)">${fmt(p.size)} rows · ${p.share_pct}%</span></div>
  <div class="h-1.5 rounded-full mb-3" style="background:var(--panel2)"><div class="h-full rounded-full" style="width:${Math.min(100,p.share_pct)}%;background:${clColor(p.cluster)}"></div></div>
  ${p.traits.length?`<ul class="text-sm space-y-1" style="color:var(--dim)">${p.traits.map(t=>`<li>• ${esc(t)}</li>`).join('')}</ul>`:`<p class="text-sm" style="color:var(--faint)">Close to the overall average on every column.</p>`}</div>`).join('');
 const fields=(R.schema||[]).slice(0,12).map((s,i)=>`<div><label class="lbl">${esc(s.name)}</label>${s.type==='numeric'?`<input class="inp" type="number" step="any" placeholder="e.g. ${esc(s.example)}" value="${esc(c.predVals[s.name]??'')}" oninput="clSetVal(${i},this.value)">`:
  `<select class="inp" onchange="clSetVal(${i},this.value)"><option value="">(any)</option>${(s.choices||[]).map(v=>`<option ${c.predVals[s.name]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`}</div>`).join('');
 const out=c.predOut?`<div class="mt-4 p-4 rounded-xl" style="background:rgba(52,211,153,.1)"><div class="font-semibold">This record belongs to <span style="color:var(--ok)">${esc(c.predOut.name)}</span>${c.predOut.share_pct!=null?` <span class="text-xs" style="color:var(--dim)">(${c.predOut.share_pct}% of the data)</span>`:''}</div>${c.predOut.traits.length?`<ul class="text-sm mt-1" style="color:var(--dim)">${c.predOut.traits.map(t=>`<li>• ${esc(t)}</li>`).join('')}</ul>`:''}</div>`:'';
 return `<div class="card p-6 mb-6" style="border-color:rgba(99,102,241,.45)"><div class="text-xs mb-1" style="color:var(--dim)">Best result</div>
  <div class="text-xl font-bold disp">${esc(name(b.algorithm))} · ${b.n_clusters} clusters <span class="text-sm font-normal" style="color:var(--dim)">(${esc(b.param)})</span></div>
  <p class="text-sm mt-2" style="color:var(--dim)">Silhouette score <b class="mono !text-white">${b.silhouette}</b> means <b style="color:#c7d2fe">${esc(b.quality)}</b>. Scores near 1 mean tight, well-separated groups; near 0 means groups overlap.</p>
  ${notes.map(n=>`<p class="text-xs mt-2" style="color:#fbbf24">${n}</p>`).join('')}
  <div class="flex flex-wrap gap-2 mt-4"><button class="btn" onclick="downloadClusters()">${ic('file',16)} Download CSV with clusters</button><button class="btn btn-p" onclick="explainClusters()">${ic('spark',16)} Explain with AI</button></div></div>
 <h2 class="text-base font-semibold mb-3">Algorithm comparison</h2>
 <div class="card overflow-x-auto mb-2"><table class="w-full min-w-[640px]"><thead><tr class="[&_th]:pt-4"><th>Algorithm</th><th>Setting</th><th>Clusters</th><th>Silhouette ↑</th><th>Davies-Bouldin ↓</th><th>Calinski-Harabasz ↑</th><th>Noise</th></tr></thead><tbody>${algoRows}</tbody></table></div>
 <p class="text-xs mb-6" style="color:var(--faint)">The best one has the highest silhouette score (points DBSCAN marks as noise count against it). Compare the other columns too: lower Davies-Bouldin and higher Calinski-Harabasz are better.</p>
 <div class="grid lg:grid-cols-2 gap-4 mb-6"><div class="card p-5"><div class="font-semibold text-sm mb-1">How many clusters? (silhouette)</div><div class="mb-2">${legend}</div>${clLineChart(curveSeries,'silhouette')}</div>
  <div class="card p-5"><div class="font-semibold text-sm mb-1">Groups on a 2D map</div><div class="text-xs mb-2" style="color:var(--dim)">Your columns squeezed into two axes (PCA). Colors are the best result's clusters.</div>${clScatter(R.pca)}</div></div>
 ${elbow?`<div class="card p-5 mb-6"><div class="font-semibold text-sm mb-1">Elbow curve (K-Means inertia)</div><div class="text-xs mb-2" style="color:var(--dim)">Look for the bend where adding more clusters stops helping much.</div>${clLineChart(elbow,'inertia')}</div>`:''}
 <h2 class="text-base font-semibold mb-3">What each cluster looks like</h2><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4 mb-6">${cards}</div>
 <div class="card p-6 mb-6"><h2 class="text-base font-semibold mb-1">Which cluster would a new record fall in?</h2><p class="text-xs mb-4" style="color:var(--dim)">Fill in values (blank = typical value). Assigned to the nearest cluster centre.${(R.schema||[]).length>12?` Showing the first 12 of ${R.schema.length} columns; the rest use typical values.`:''}</p>
  <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${fields}</div>
  <button class="btn btn-p mt-4" onclick="clAssign()" ${c.predBusy?'disabled':''}>${c.predBusy?'Checking…':'Find cluster'}</button>
  ${c.predErr?`<div class="mt-3 text-sm" style="color:#f87171">${esc(c.predErr)}</div>`:''}${out}</div>`}

function experimentsPage(){const p=S.profile;
 const head=`<h1 class="text-2xl font-bold">Experiments</h1><p class="text-sm mt-1 mb-6" style="color:var(--dim)">Clustering lab: let algorithms find natural groups in your data. No target column needed.</p>`;
 if(!p)return head+`<div class="card p-10 text-center max-w-xl"><p class="text-sm mb-4" style="color:var(--dim)">Upload a CSV first, then come back here to find groups in it.</p><button class="btn btn-p" onclick="go('upload')">Upload dataset</button></div>`;
 const c=initCl();
 const cfg=`<div class="card p-6 mb-6"><div class="mb-4"><div class="font-semibold">${esc(p.name)}</div><div class="text-xs" style="color:var(--dim)">${fmt(p.rows)} rows · ${p.cols} columns</div></div>
  <label class="lbl">Columns to group by (${c.sel.size} selected)</label><div class="flex flex-wrap gap-2 mb-5">${p.columns.map((x,i)=>clChip(c.sel.has(x.n),x.n,`clToggleCol(${i})`,x.t)).join('')}</div>
  <label class="lbl">Algorithms</label><div class="flex flex-wrap gap-2 mb-5">${CL_ALGOS.map(a=>clChip(c.algos.has(a[0]),a[1],`clToggleAlgo('${a[0]}')`,a[2])).join('')}</div>
  <div class="flex flex-wrap items-end gap-4"><div><label class="lbl">Min clusters</label><input type="number" min="2" max="12" class="inp !w-24" value="${c.kmin}" onchange="clSetK('kmin',this.value)"></div>
  <div><label class="lbl">Max clusters</label><input type="number" min="2" max="12" class="inp !w-24" value="${c.kmax}" onchange="clSetK('kmax',this.value)"></div>
  <button class="btn btn-p" onclick="runClustering()" ${c.busy?'disabled':''}>${c.busy?`${ic('load',16,'spin')} Finding groups…`:`${ic('flask',16)} Run clustering`}</button></div>
  <p class="text-xs mt-3" style="color:var(--faint)">IDs, free-text and mostly-empty columns are skipped automatically. Big files are sampled to 3,000 rows for speed.</p>
  ${c.err?`<div class="mt-4 p-3 rounded-xl text-sm" style="background:rgba(248,113,113,.12);color:#f87171">${esc(c.err)}</div>`:''}</div>`;
 const hist=c.history.length?`<h2 class="text-base font-semibold mb-3">Runs this session</h2><div class="card overflow-x-auto mb-6"><table class="w-full min-w-[480px]"><thead><tr class="[&_th]:pt-4"><th>Time</th><th>Best algorithm</th><th>Clusters</th><th>Silhouette</th><th>Columns</th></tr></thead><tbody>${c.history.map(h=>`<tr><td class="mono">${new Date(h.at).toLocaleTimeString()}</td><td class="!text-white">${esc(h.algo)} <span class="mono" style="color:var(--dim)">${esc(h.param)}</span></td><td class="mono">${h.k}</td><td class="mono">${h.sil}</td><td class="mono">${h.cols}</td></tr>`).join('')}</tbody></table></div>`:'';
 return head+cfg+(c.res?clResults(c.res,c):'')+hist}

function placeholder(n){return `<div class="card p-12 text-center max-w-xl mx-auto mt-10"><div class="w-12 h-12 mx-auto rounded-xl flex items-center justify-center mb-4" style="background:rgba(99,102,241,.15);color:#a5b4fc">${ic('spark',22)}</div>
 <h2 class="text-lg font-semibold">${n}</h2><p class="text-sm mt-2 mb-5" style="color:var(--dim)">This section is not built yet. Start a new project to run the full pipeline.</p><button class="btn btn-p" onclick="go('upload')">${ic('plus',16)} New Project</button></div>`}

/* ============ router ============ */
function render(){const app=$('#app');
 if(!S.user){app.innerHTML=auth();return}
 const V={dashboard,experiments:experimentsPage,upload,profile,target,features:featuresPage,training,results,analysis,predict:predictPage,projects:projectsPage,'project-detail':projectDetails,datasets:datasetsPage,insights:insightsPage,settings:settingsPage};
 const name=(NAV.find(n=>n[0]===S.route)||[])[1];
 app.innerHTML=shell(V[S.route]?V[S.route]():placeholder(name||'Coming soon'));
 const m=$('#insight-messages');if(m)m.scrollTop=m.scrollHeight}
function logout(){S.menu=false;if(CloudStorage.ready)Auth.signOut();else{S.user=null;S.projects=[];go('dashboard')}}
async function loadUserProjects(){
 if(!S.user?.uid||!CloudStorage.ready){S.projects=[];return render()}
 try{S.projects=await Db.listProjects(S.user.uid);S.dataErr=''}
 catch(error){S.dataErr=`Could not load projects: ${error.message}`}
 render();
 if(S.route==='datasets')loadDatasets()
}
if(CloudStorage.ready){
 // keeps the session across refreshes; fires once immediately with the current user (or null)
 Auth.onChange(u=>{S.user=u;loadUserProjects();if(u)loadDatasets()})
}
render();
</script>
</body>
</html>
